<svg viewBox="0 0 720 360" role="img" xmlns="http://www.w3.org/2000/svg" width="720" height="360">
  <style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}.tick,.axis-title,.note{fill:#898781;font-size:12px}.end-label,.row-label,.value{fill:#52514e;font-size:12.5px}.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.dot{stroke:#fcfcfb;stroke-width:2}.dot.hollow{fill:#fcfcfb;stroke-width:2.5}</style>
  <rect width="100%" height="100%" fill="#fcfcfb" />
  <title>Topic area B accuracy by skill count</title>
  <line class="grid" x1="56" x2="570" y1="312.0" y2="312.0" />
  <text class="tick" x="48" y="316.0" text-anchor="end">0%</text>
  <line class="grid" x1="56" x2="570" y1="240.0" y2="240.0" />
  <text class="tick" x="48" y="244.0" text-anchor="end">25%</text>
  <line class="grid" x1="56" x2="570" y1="168.0" y2="168.0" />
  <text class="tick" x="48" y="172.0" text-anchor="end">50%</text>
