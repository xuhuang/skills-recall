  <text class="tick" x="48" y="28.0" text-anchor="end">100%</text>
  <line class="axis" x1="56" x2="570" y1="312" y2="312" />
  <text class="tick" x="99.0" y="330" text-anchor="middle">5</text>
  <text class="tick" x="157.7" y="330" text-anchor="middle">20</text>
  <text class="tick" x="275.1" y="330" text-anchor="middle">50</text>
  <text class="tick" x="548.9" y="330" text-anchor="middle">120</text>
  <text class="axis-title" x="313.0" y="352" text-anchor="middle">Skills loaded in the session</text>
  <polygon points="99.0,45.6 157.7,247.2 275.1,276.0 548.9,268.8 548.9,312.0 275.1,312.0 157.7,312.0 99.0,153.6" style="fill:#1baf7a;opacity:.12" />
  <path class="line" d="M99.0,96.0 L157.7,283.2 L275.1,297.6 L548.9,297.6" style="stroke:#1baf7a" />
  <circle class="dot" cx="99.0" cy="96.0" r="5" style="fill:#1baf7a">
    <title>5 skills: 75% (95% interval 55–92%, 40 runs)</title>
  </circle>
  <text class="value" x="99.0" y="86.0" text-anchor="middle">75%</text>
  <circle class="dot" cx="157.7" cy="283.2" r="5" style="fill:#1baf7a">
    <title>20 skills: 10% (95% interval 0–22%, 40 runs)</title>
  </circle>
  <text class="value" x="157.7" y="273.2" text-anchor="middle">10%</text>
  <circle class="dot" cx="275.1" cy="297.6" r="5" style="fill:#1baf7a">
    <title>50 skills: 5% (95% interval 0–12%, 40 runs)</title>
  </circle>
  <text class="value" x="275.1" y="287.6" text-anchor="middle">5%</text>
  <circle class="dot" cx="548.9" cy="297.6" r="5" style="fill:#1baf7a">
    <title>120 skills: 5% (95% interval 0–15%, 40 runs)</title>
  </circle>
